name: Desktop Agent packages
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install -r requirements-agent-build.txt
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python scripts/check_agent_desktop.py
      - run: python scripts/build_agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: delta-agent-${{ matrix.os }}
          path: |
            dist/agent/*.dmg
            dist/agent/*.zip
            dist/agent/*.tar.gz
