[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-desktop"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "websockets>=14,<16", "pyside6-essentials>=6.8,<7", "pywin32>=311; sys_platform == 'win32'", "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[project.gui-scripts]
delta-agent-desktop = "delta_agent.desktop:main"

[tool.setuptools.packages.find]
where = ["apps/delta-agent", "shared/contracts"]
include = ["delta_agent*", "delta_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/delta-agent", "shared/contracts"]
asyncio_mode = "auto"
